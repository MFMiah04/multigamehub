<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf8ec">
  <meta name="description" content="Free party games to play together on phones or computers: Spyfall, Imposter, Fakin' It and Herd Mentality. Make a room, share the code, play.">
  <title>MultigameHub · party games to play together</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="MultigameHub">

  <!-- Link previews when an invite is pasted into a chat app -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MultigameHub">
  <meta property="og:title" content="Come play on MultigameHub!">
  <meta property="og:description" content="Free party games to play together on phones or computers. Tap to join the room.">
  <meta property="og:url" content="https://multigame-hub.web.app/">
  <meta property="og:image" content="https://multigame-hub.web.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="MultigameHub: doodled sticky notes for Spyfall, Avalon, Herd Mentality and more on notebook paper">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <pattern id="pat-stripes" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V5" stroke="#222" stroke-width="1.5" stroke-opacity=".35"/></pattern>
      <pattern id="pat-hstripes" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 3H6" stroke="#222" stroke-width="1.6" stroke-opacity=".35"/></pattern>
      <pattern id="pat-dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#222" fill-opacity=".4"/></pattern>
      <pattern id="pat-zigzag" width="8" height="6" patternUnits="userSpaceOnUse"><path d="M0 4L2 2L4 4L6 2L8 4" fill="none" stroke="#222" stroke-width="1.3" stroke-opacity=".4"/></pattern>
      <pattern id="pat-check" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#222" fill-opacity=".15"/><rect x="4" y="4" width="4" height="4" fill="#222" fill-opacity=".15"/></pattern>
      <pattern id="pat-stars" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M5 1.6l1 2.1 2.3.3-1.7 1.6.4 2.3L5 6.8 2.9 7.9l.4-2.3L1.6 4l2.3-.3z" fill="#222" fill-opacity=".3"/></pattern>
      <pattern id="pat-hearts" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M4.5 7.2C1.6 5.3 1.7 2.9 3.2 2.9c.8 0 1.3.8 1.3.8s.5-.8 1.3-.8c1.5 0 1.6 2.4-1.3 4.3z" fill="#222" fill-opacity=".3"/></pattern>
      <pattern id="pat-waves" width="10" height="6" patternUnits="userSpaceOnUse"><path d="M0 3q2.5-3 5 0t5 0" fill="none" stroke="#222" stroke-width="1.3" stroke-opacity=".4"/></pattern>
      <pattern id="pat-spots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2.6" fill="#222" fill-opacity=".22"/><circle cx="11" cy="10.5" r="1.8" fill="#222" fill-opacity=".22"/></pattern>
      <pattern id="pat-split" width="60" height="60" patternUnits="userSpaceOnUse"><rect x="24" width="36" height="60" fill="#222" fill-opacity=".15"/></pattern>
    </defs>
  </svg>
  <div id="app"><main class="page"><p class="note center loading">Sharpening pencils…</p></main></div>
  <div id="overlay"></div>
  <div id="toast" class="toast wobble" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
